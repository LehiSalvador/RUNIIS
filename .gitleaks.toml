# Synthetic SQL fixtures and local-only seeds use columns such as key/document_key/grant_key/
# effect_key with readable literal values; the generic entropy rule flags them although they are
# test data. Every provider-specific secret rule stays active for these paths.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic SQL test fixtures and local seeds (generic-api-key only)"
targetRules = ["generic-api-key"]
paths = ['''(^|/)supabase/tests/database/[^/]+\.test\.sql$''', '''(^|/)supabase/seeds/[^/]+\.sql$''']

[[allowlists]]
description = "Hosting-state label in audit/roadmap docs (CURRENT_LEGACY_HOSTING_PENDING_MIGRATION is not a Netlify token)"
targetRules = ["netlify-access-token"]
regexTarget = "match"
regexes = ['''CURRENT_LEGACY_HOSTING_PENDING_MIGRATION''']

# Known history finding: commit 17fc6c3 carried an EMPTY placeholder (`GOOGLE_CLIENT_SECRET=`, line 6) in
# .env.example; the "secret" is the variable name itself, there is no value. Narrow on purpose: this
# exact commit AND this exact file AND the generic rule (condition AND), so no other path, commit or
# provider-specific rule is relaxed.
[[allowlists]]
description = "Empty placeholder variable in .env.example at commit 17fc6c3 (no secret value)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["17fc6c36c33ac8d335acec663ac36bbbfbba0c03"]
paths = ['''^\.env\.example$''']

# Known history finding: commit 8daff0b carried a synthetic bypass-secret literal in the harness
# self-test (tests/e2e/harness/plumbing.spec.ts); it matches no real secret and was replaced by a
# runtime-built value in the next commit. Narrow on purpose: this exact commit AND this exact file AND
# the generic rule (condition AND).
[[allowlists]]
description = "Synthetic test literal in the E2E harness self-test at commit 8daff0b (no real secret)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["8daff0b8557859c1c715838c1b0144e739e8ab72"]
paths = ['''tests/e2e/harness/plumbing\.spec\.ts$''']

# Known history finding: commit bcd9b6f carried a synthetic idempotency key literal ("key-12345678") in a unit
# test of the API client; an idempotency key is a request de-duplication token, not a credential, and the next
# commit builds it at runtime. Narrow on purpose: this exact commit AND this exact file AND the generic rule.
[[allowlists]]
description = "Synthetic idempotency key literal in the API client unit test at commit bcd9b6f (no secret)"
condition = "AND"
targetRules = ["generic-api-key"]
commits = ["bcd9b6f6bafa0ae888a4bca46f85e6e6ea8aedf3"]
paths = ['''tests/unit/server/client-api-put.test.ts$''']
